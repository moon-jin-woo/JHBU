<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리의 중화반응 그래프 연구실</title><style>
:root{font-family:system-ui,'Noto Sans KR',sans-serif;color:#17243a;background:#f2f5fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1220px;margin:auto;padding:32px 20px}h1{font-size:30px;margin:0 0 8px}p{color:#637086;margin:0 0 24px}.layout{display:grid;grid-template-columns:340px 1fr;gap:20px}.panel{background:white;border:1px solid #e2e8f0;border-radius:18px;padding:22px;box-shadow:0 8px 30px #17243a0a}h2{font-size:17px;margin:0 0 20px}.field{margin-bottom:18px}label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:#46546a}select,input{width:100%;border:1px solid #d6dfeb;background:#fff;border-radius:9px;padding:11px;font:inherit;color:#17243a}input:focus,select:focus{outline:2px solid #91b5ff}.tabs{display:flex;background:#edf2f8;padding:4px;border-radius:10px;margin-bottom:20px}.tabs button{flex:1;padding:10px;border:0;background:none;border-radius:8px;cursor:pointer;font-weight:700;color:#65738b}.tabs button.active{background:#fff;color:#2459cb;box-shadow:0 1px 5px #0001}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chartbox{position:relative}canvas{width:100%;height:460px;display:block}.legend{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0}.legend label{display:flex;align-items:center;gap:6px;margin:0;cursor:pointer;font-size:13px}.dot{width:11px;height:11px;border-radius:50%;display:inline-block}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.metric{background:#f4f7fc;border-radius:12px;padding:15px}.metric span{font-size:12px;color:#68768d}.metric strong{display:block;font-size:20px;margin-top:5px}.note{font-size:12px;color:#6c778b;line-height:1.7;margin-top:17px}.actions{display:flex;gap:10px;margin-top:18px}button.primary,button.secondary{padding:11px 15px;border-radius:9px;cursor:pointer;font-weight:700;border:1px solid #cbd7e8;background:#fff;color:#2459cb}button.primary{background:#2459cb;color:white;border-color:#2459cb}.range{width:100%;accent-color:#2459cb}#mixInfo{font-size:13px;color:#56657a;margin:0 0 15px}.hidden{display:none}@media(max-width:850px){.layout{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}canvas{height:360px}}@media(max-width:460px){.metrics{grid-template-columns:1fr}.two{grid-template-columns:1fr}}

.chart-heading{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 14px;margin-bottom:10px}
.chart-heading h2{margin:0}
.zoom-toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.zoom-toolbar label{margin:0;font-size:12px;white-space:nowrap}
.zoom-toolbar select{width:auto;min-width:90px;padding:7px 8px;font-size:12px}
.zoom-toolbar button{height:34px;min-width:34px;padding:6px 9px;border:1px solid #cbd7e8;background:#f7f9fc;border-radius:8px;color:#2459cb;font-weight:750;cursor:pointer;font-size:13px}
.zoom-toolbar button:hover{background:#e8efff}
.zoom-toolbar button:focus-visible{outline:2px solid #2459cb;outline-offset:2px}
.zoom-toolbar output{min-width:110px;text-align:center;font-size:12px;font-weight:700;color:#50627d;white-space:nowrap}
.zoom-help{font-size:12px;color:#64748b;margin:5px 0 0;line-height:1.6}
.chartbox canvas{touch-action:none;cursor:grab}
.chartbox canvas.dragging{cursor:grabbing}
@media(max-width:600px){.chart-heading{align-items:flex-start;flex-direction:column}.zoom-toolbar{width:100%}.zoom-toolbar output{min-width:90px}}
</style></head><body><main class="wrap"><h1>현빈이의 중화반응 그래프 연구실</h1><p>중화반응에 따른 이온 몰수 변화 시뮬레이션</p><div class="layout"><section class="panel"><h2>실험 조건</h2><div class="tabs"><button id="injectTab" class="active">주입형</button><button id="mixTab">혼합형</button></div><div class="field"><label for="acid">산 종류</label><select id="acid"><option value="1">HA — 1가 산</option><option value="2">H₂A′ — 2가 산</option></select></div><div class="field"><label for="base">염기 종류</label><select id="base"><option value="1">BOH — 1가 염기</option><option value="2">B′(OH)₂ — 2가 염기</option></select></div><div class="two"><div class="field"><label>산 농도 (mol/L)</label><input id="ca" type="number" min="0.001" step="0.1" value="1"></div><div class="field"><label>염기 농도 (mol/L)</label><input id="cb" type="number" min="0.001" step="0.1" value="1"></div></div><div class="two"><div class="field"><label>초기 산 부피 (mL)</label><input id="va" type="number" min="0" step="10" value="50"></div><div class="field"><label>초기 염기 부피 (mL)</label><input id="vb" type="number" min="0" step="10" value="0"></div></div><div id="injectOptions"><div class="field"><label>주입하는 용액</label><select id="added"><option value="base">염기 주입</option><option value="acid">산 주입</option></select></div><div class="field"><label>기본 최대 주입 부피 (중화점 존재 시 자동 조정, mL)</label><input id="maxv" type="number" min="1" step="10" value="150"></div></div><div id="mixOptions" class="hidden"><div class="field"><label>추가 혼합량 (mL): <b id="mixValue">0</b></label><input class="range" id="mix" type="range" min="0" max="150" value="0" step="1"></div><div id="mixInfo">산과 염기의 초기 부피에 추가 용액을 혼합합니다.</div><div class="field"><label>추가하는 용액</label><select id="mixAdded"><option value="base">염기</option><option value="acid">산</option></select></div></div><div class="actions"><button class="primary" id="reset">초기화</button><button class="secondary" id="download">그래프 PNG 저장</button></div></section><section class="panel"><div class="chart-heading"><h2 id="chartTitle">이온 몰수 - 주입 부피 그래프</h2><div class="zoom-toolbar" role="group" aria-label="그래프 확대 축소 조절"><label for="zoomAxis">조절 축</label><select id="zoomAxis" aria-label="확대 축 선택"><option value="both">X·Y 모두</option><option value="x">X축만</option><option value="y">Y축만</option></select><button type="button" id="zoomOut" aria-label="축소" title="축소">−</button><output id="zoomLabel" aria-live="polite">X 100% · Y 100%</output><button type="button" id="zoomIn" aria-label="확대" title="확대">＋</button><button type="button" id="zoomReset" title="기본 축 범위 복원">보기 초기화</button></div></div><div class="chartbox"><canvas id="chart" aria-label="중화반응 이온 몰수 그래프: 마우스 휠 확대·축소, 드래그 이동"></canvas></div><div class="zoom-help">휠: 확대·축소 · 드래그: 그래프 이동 · 터치: 두 손가락 확대·축소 · 더블클릭: 보기 초기화</div><div class="legend" id="legend"></div><div class="metrics"><div class="metric"><span>중화점 주입량</span><strong id="eq">—</strong></div><div class="metric"><span>중화점에서 총 이온 몰수</span><strong id="eqTotal">—</strong></div><div class="metric"><span>현재 총 이온 몰수</span><strong id="now">—</strong></div></div><div class="note" id="explanation"></div></section></div></main><script>
const $ = id => document.getElementById(id);
let mode = 'inject';
let seriesVisible = {H:true, OH:true, A:true, B:true, total:true};
const colors = {H:'#e45757', OH:'#2a9b86', A:'#586bd8', B:'#dc9b37', total:'#202d42'};
const labels = {H:'H⁺', OH:'OH⁻', A:'산 음이온', B:'염기 양이온', total:'전체 이온 수'};
const PAD = {left:58,right:22,top:25,bottom:52};
const zoomBase = {xMin:0,xMax:100,yMin:0,yMax:100};
let view = {...zoomBase};
let experiment = null;
let equivalence = NaN;
let initialSpectator = 0;
let defaultMaxVolume = 100;
const clamp = (v, lo, hi) => Math.max(lo,Math.min(hi,v));
function fmt(n){return Number.isFinite(n)?Number(n.toFixed(4)).toString():'—'}

// 완전 해리 강산·강염기: 주입 부피에 따른 입자별 몰수 (mmol)
function calc(v,p){
  const {na,nb,ca,cb,va,vb,added}=p;
  const acidM=ca*(va+(added==='acid'?v:0))/1000;
  const baseM=cb*(vb+(added==='base'?v:0))/1000;
  const h=Math.max(0,na*acidM-nb*baseM);
  const oh=Math.max(0,nb*baseM-na*acidM);
  return {H:h*1000,OH:oh*1000,A:acidM*1000,B:baseM*1000,total:(h+oh+acidM+baseM)*1000};
}
function setMode(m){
  mode=m;
  $('injectTab').classList.toggle('active',m==='inject');
  $('mixTab').classList.toggle('active',m==='mix');
  $('injectOptions').classList.toggle('hidden',m!=='inject');
  $('mixOptions').classList.toggle('hidden',m!=='mix');
  update();
}
function update(resetViewport=true){
  const na=+$('acid').value,nb=+$('base').value;
  const ca=Math.max(.000001,+$('ca').value||0),cb=Math.max(.000001,+$('cb').value||0);
  const va=Math.max(0,+$('va').value||0),vb=Math.max(0,+$('vb').value||0);
  const added=mode==='inject'?$('added').value:$('mixAdded').value;
  let maxv=mode==='mix'?Math.max(1,+$('mix').max||150):Math.max(1,+$('maxv').value||1);
  experiment={na,nb,ca,cb,va,vb,added};
  let eq=added==='base'?(na*ca*va-nb*cb*vb)/(nb*cb):(nb*cb*vb-na*ca*va)/(na*ca);
  equivalence=eq>=0?eq:NaN;
  if(Number.isFinite(equivalence)&&equivalence>0)maxv=2*equivalence;
  defaultMaxVolume=maxv;
  initialSpectator=added==='base'?ca*va:cb*vb;
  // 최초 표시에서는 중화점 X 50%, 초기 구경꾼 이온 Y 50% 유지
  let yMax;
  if(initialSpectator>0)yMax=2*initialSpectator;
  else {
    let peak=0;
    for(let i=0;i<=150;i++){
      const d=calc(maxv*i/150,experiment);
      for(const k of Object.keys(seriesVisible))if(seriesVisible[k])peak=Math.max(peak,d[k]);
    }
    yMax=Math.max(.1,peak)*1.12;
  }
  zoomBase.xMin=0;zoomBase.xMax=maxv;
  zoomBase.yMin=0;zoomBase.yMax=yMax;
  if(resetViewport)view={...zoomBase};
  $('eq').textContent=Number.isFinite(equivalence)?fmt(equivalence)+' mL':'범위 밖';
  $('eqTotal').textContent=Number.isFinite(equivalence)?fmt(calc(equivalence,experiment).total)+' mmol':'—';
  const cur=mode==='mix'?+$('mix').value:defaultMaxVolume;
  $('now').textContent=fmt(calc(cur,experiment).total)+' mmol';
  $('mixValue').textContent=$('mix').value;
  $('chartTitle').textContent='이온 몰수 - '+(mode==='inject'?'주입':'추가 혼합')+' 부피 그래프';
  $('explanation').textContent=`기본 보기에서 중화점은 가로축 중앙(50%), 초기 구경꾼 이온은 세로축 중앙(50%)입니다. 확대·축소 시 해당 위치는 달라질 수 있습니다. 완전 해리 강산·강염기 모형이며 H⁺와 OH⁻는 1:1로 반응합니다. ${na===1?'HA → H⁺ + A⁻':'H₂A′ → 2H⁺ + A′²⁻'}; ${nb===1?'BOH → B⁺ + OH⁻':'B′(OH)₂ → B′²⁺ + 2OH⁻'}. 세로축 단위는 mmol이고, 전체 이온 수는 남은 H⁺/OH⁻와 구경꾼 이온의 입자 몰수 합계입니다.`;
  if(mode==='mix')$('mixInfo').textContent=`현재 ${added==='base'?'염기':'산'} ${fmt(cur)} mL 추가 혼합 · 최종 부피 ${fmt(va+vb+cur)} mL`;
  renderLegend();render();
}
function renderLegend(){
  const box=$('legend');box.innerHTML='';
  for(const k of Object.keys(seriesVisible)){
    const l=document.createElement('label');
    const cb=document.createElement('input');cb.type='checkbox';cb.checked=seriesVisible[k];cb.style.width='auto';
    cb.onchange=()=>{seriesVisible[k]=cb.checked;update(false)};
    const dot=document.createElement('span');dot.className='dot';dot.style.background=colors[k];
    const name=k==='A'?($('acid').value==='1'?'A⁻':'A′²⁻'):k==='B'?($('base').value==='1'?'B⁺':'B′²⁺'):labels[k];
    l.append(cb,dot,document.createTextNode(name));box.append(l);
  }
}
function render(){
  if(!experiment)return;
  const pctX=Math.round(100*(zoomBase.xMax-zoomBase.xMin)/(view.xMax-view.xMin));
  const pctY=Math.round(100*(zoomBase.yMax-zoomBase.yMin)/(view.yMax-view.yMin));
  $('zoomLabel').textContent=`X ${pctX}% · Y ${pctY}%`;
  draw();
}
function draw(){
  const canvas=$('chart'),rect=canvas.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1,w=rect.width,h=rect.height;
  if(w<=0||h<=0)return;
  canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
  const c=canvas.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);
  c.fillStyle='white';c.fillRect(0,0,w,h);
  const {left,right,top,bottom}=PAD;
  const pw=Math.max(1,w-left-right),ph=Math.max(1,h-top-bottom);
  const xSpan=view.xMax-view.xMin,ySpan=view.yMax-view.yMin;
  const X=v=>left+pw*(v-view.xMin)/xSpan;
  const Y=v=>h-bottom-ph*(v-view.yMin)/ySpan;
  c.font='12px system-ui';c.lineWidth=1;
  for(let i=0;i<=5;i++){
    const y=top+ph*i/5;
    c.strokeStyle='#e9eef5';c.beginPath();c.moveTo(left,y);c.lineTo(w-right,y);c.stroke();
    c.fillStyle='#64748b';c.textAlign='right';
    c.fillText(fmt(view.yMax-ySpan*i/5),left-9,y+4);
  }
  for(let i=0;i<=5;i++){
    const x=left+pw*i/5;
    c.strokeStyle='#f3f6fb';c.beginPath();c.moveTo(x,top);c.lineTo(x,h-bottom);c.stroke();
    c.fillStyle='#64748b';c.textAlign='center';
    c.fillText(fmt(view.xMin+xSpan*i/5),x,h-bottom+20);
  }
  c.strokeStyle='#475569';c.lineWidth=1.3;
  c.beginPath();c.moveTo(left,top);c.lineTo(left,h-bottom);c.lineTo(w-right,h-bottom);c.stroke();
  if(initialSpectator>=view.yMin&&initialSpectator<=view.yMax&&initialSpectator>0){
    const sy=Y(initialSpectator);
    c.strokeStyle='#94a3b8';c.setLineDash([2,5]);
    c.beginPath();c.moveTo(left,sy);c.lineTo(w-right,sy);c.stroke();c.setLineDash([]);
  }
  c.fillStyle='#334155';c.textAlign='left';c.fillText('이온 몰수 (mmol)',left,14);
  c.textAlign='center';c.fillText('추가 부피 (mL)',left+pw/2,h-8);
  if(Number.isFinite(equivalence)&&equivalence>=view.xMin&&equivalence<=view.xMax){
    c.strokeStyle='#8e99ad';c.setLineDash([5,5]);c.beginPath();c.moveTo(X(equivalence),top);c.lineTo(X(equivalence),h-bottom);c.stroke();c.setLineDash([]);
    c.fillStyle='#64748b';c.textAlign=X(equivalence)>w-115?'right':'left';
    c.fillText('중화점 '+fmt(equivalence)+' mL',X(equivalence)+(X(equivalence)>w-115?-5:5),top+14);
  }
  c.save();c.beginPath();c.rect(left,top,pw,ph);c.clip();
  for(const k of ['A','B','H','OH','total']){
    if(!seriesVisible[k])continue;
    c.strokeStyle=colors[k];c.lineWidth=k==='total'?3:2.2;
    c.beginPath();
    for(let i=0;i<=500;i++){
      const v=view.xMin+xSpan*i/500;
      const point=calc(v,experiment);
      if(i===0)c.moveTo(X(v),Y(point[k]));else c.lineTo(X(v),Y(point[k]));
    }
    c.stroke();
  }
  if(mode==='mix'){
    const v=+$('mix').value,x=X(v),y=Y(calc(v,experiment).total);
    c.strokeStyle='#a4acb9';c.setLineDash([3,4]);c.beginPath();c.moveTo(x,top);c.lineTo(x,h-bottom);c.stroke();c.setLineDash([]);
    c.fillStyle='#1f2937';c.beginPath();c.arc(x,y,4,0,Math.PI*2);c.fill();
  }
  c.restore();
}
// 기본 보기의 부피·몰수 범위를 기준으로 축별 확대율을 적용한다.
// 확대 중심은 차트의 중심(또는 마우스 포인터)으로 계산한다.
function zoomAt(factor,axes=$('zoomAxis').value,fx=.5,fy=.5){
  const rescale=(axis,fraction)=>{
    const minKey=axis+'Min',maxKey=axis+'Max';
    const baseSpan=zoomBase[maxKey]-zoomBase[minKey];
    const oldSpan=view[maxKey]-view[minKey];
    const newSpan=clamp(oldSpan/factor,baseSpan/25,baseSpan*20);
    const f=clamp(fraction,0,1);
    const anchor=view[minKey]+oldSpan*f;
    const newMin=Math.max(0,anchor-newSpan*f);
    view[minKey]=newMin;view[maxKey]=newMin+newSpan;
  };
  if(axes==='both'||axes==='x')rescale('x',fx);
  if(axes==='both'||axes==='y')rescale('y',fy);
  render();
}
function restoreView(){view={...zoomBase};render()}
$('zoomIn').onclick=()=>zoomAt(1.25);
$('zoomOut').onclick=()=>zoomAt(.8);
$('zoomReset').onclick=restoreView;
const canvas=$('chart');
function plotSize(){
  const rect=canvas.getBoundingClientRect();
  return {rect,w:rect.width-PAD.left-PAD.right,h:rect.height-PAD.top-PAD.bottom};
}
function fractions(clientX,clientY){
  const {rect,w,h}=plotSize();
  return {x:clamp((clientX-rect.left-PAD.left)/Math.max(1,w),0,1),y:clamp((rect.bottom-PAD.bottom-clientY)/Math.max(1,h),0,1)};
}
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  const f=fractions(e.clientX,e.clientY);
  zoomAt(e.deltaY<0?1.12:1/1.12,$('zoomAxis').value,f.x,f.y);
},{passive:false});
const activePointers=new Map();
canvas.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  canvas.setPointerCapture(e.pointerId);canvas.classList.add('dragging');
});
canvas.addEventListener('pointermove',e=>{
  if(!activePointers.has(e.pointerId))return;
  const previous=new Map(activePointers);
  activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const {w,h}=plotSize();
  if(activePointers.size===1){
    const last=previous.get(e.pointerId);
    const dx=e.clientX-last.x,dy=e.clientY-last.y;
    const spanX=view.xMax-view.xMin,spanY=view.yMax-view.yMin;
    const shiftX=dx/Math.max(1,w)*spanX,shiftY=dy/Math.max(1,h)*spanY;
    const xMin=Math.max(0,view.xMin-shiftX),yMin=Math.max(0,view.yMin+shiftY);
    view.xMax=xMin+spanX;view.xMin=xMin;view.yMax=yMin+spanY;view.yMin=yMin;
    render();
  }else if(activePointers.size===2){
    const keys=[...activePointers.keys()];
    const a=activePointers.get(keys[0]),b=activePointers.get(keys[1]);
    const oldA=previous.get(keys[0]),oldB=previous.get(keys[1]);
    const dist=Math.hypot(a.x-b.x,a.y-b.y);
    const oldDist=Math.hypot(oldA.x-oldB.x,oldA.y-oldB.y);
    if(oldDist>5&&dist>5){
      const f=fractions((a.x+b.x)/2,(a.y+b.y)/2);
      zoomAt(dist/oldDist,$('zoomAxis').value,f.x,f.y);
    }
  }
});
function endPointer(e){activePointers.delete(e.pointerId);if(!activePointers.size)canvas.classList.remove('dragging')}
canvas.addEventListener('pointerup',endPointer);
canvas.addEventListener('pointercancel',endPointer);
canvas.addEventListener('lostpointercapture',endPointer);
canvas.addEventListener('dblclick',restoreView);
for(const id of ['acid','base','ca','cb','va','vb','added','maxv','mix','mixAdded']){
  $(id).addEventListener('input',()=>update(true));
}
$('injectTab').onclick=()=>setMode('inject');
$('mixTab').onclick=()=>setMode('mix');
$('reset').onclick=()=>{
  for(const id of ['ca','cb'])$(id).value=1;
  $('va').value=50;$('vb').value=0;
  $('acid').value=1;$('base').value=1;
  $('maxv').value=150;$('mix').value=0;
  $('added').value='base';$('mixAdded').value='base';
  $('zoomAxis').value='both';
  seriesVisible={H:true,OH:true,A:true,B:true,total:true};
  setMode('inject');
};
$('download').onclick=()=>{
  const a=document.createElement('a');a.download='neutralization-graph.png';
  a.href=canvas.toDataURL('image/png');a.click();
};
window.addEventListener('resize',render);
update();
</script></body></html>
